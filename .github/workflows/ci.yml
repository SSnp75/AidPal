name: CI

# Run the build, tests, and lint on every push and pull request to main.
# This is the "CI" stage: it protects main from broken code. Deployment (CD)
# is handled separately by the web host (Vercel/Cloudflare) which auto-builds
# from main once the repo is connected.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, test, and lint
    runs-on: ubuntu-latest

    # Test the full plan on the supported Node LTS line (20) and the next
    # LTS (22) so version-specific breakage is caught before it reaches the
    # host, which builds from main on its own Node version.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        # Catches type errors that lint does not. --noEmit means no output
        # files are written; this is a verification-only pass using the
        # TypeScript already pinned in devDependencies (no extra install).
        run: npx tsc --noEmit

      - name: Build
        # Supabase env vars are not required for the build: the app is written
        # to boot and show a "configure Supabase" screen when they are absent,
        # so the production build succeeds without secrets in CI.
        run: npm run build

      - name: Test
        # vitest run executes every *.test.ts under tests/ once (no watch).
        # New feature tests added to tests/ are picked up automatically.
        run: npm run test
